name: Open clinic review pull request
on:
  push:
    branches:
      - codex/cairo-font-sitewide
  workflow_dispatch:
permissions:
  contents: read
  pull-requests: write
concurrency:
  group: open-clinic-review-${{ github.ref }}
  cancel-in-progress: false
jobs:
  open-review:
    if: github.repository == 'mweta66/dryoussef' && github.ref == 'refs/heads/codex/cairo-font-sitewide'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create the review without merging or deploying
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_BRANCH: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          number=$(gh pr list --base main --head "$PR_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [[ -n "$number" ]]; then
            url=$(gh pr view "$number" --json url --jq .url)
          else
            if ! url=$(gh pr create --base main --head "$PR_BRANCH" --title 'توحيد خط الموقع بالكامل إلى Cairo محليًا' --body-file docs/PR-cairo-font.md 2> "$RUNNER_TEMP/clinic-pr-error"); then
              error=$(<"$RUNNER_TEMP/clinic-pr-error")
              if [[ "$error" == *'is not permitted to create or approve pull requests'* ]]; then
                echo '::error::Repository settings block GitHub Actions from creating pull requests. Enable Allow GitHub Actions to create and approve pull requests in Settings > Actions > General, then rerun this workflow.'
                echo 'Repository settings block GitHub Actions from creating pull requests. Enable Allow GitHub Actions to create and approve pull requests in Settings > Actions > General, then rerun this workflow.' >> "$GITHUB_STEP_SUMMARY"
              elif [[ "$error" == *'Resource not accessible by integration'* ]]; then
                echo '::error::The repository token cannot create pull requests with the current repository policy.'
                echo 'The repository token cannot create pull requests with the current repository policy.' >> "$GITHUB_STEP_SUMMARY"
              else
                echo '::error::Pull request creation failed. See the failed job logs for the repository policy or API error.'
                echo 'Pull request creation failed. See the failed job logs for the repository policy or API error.' >> "$GITHUB_STEP_SUMMARY"
              fi
              exit 1
            fi
          fi
          echo "Pull request: $url" >> "$GITHUB_STEP_SUMMARY"
