<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>شاشة الدور — عيادة د. يوسف</title><link rel="stylesheet" href="styles.css"><style>body{background:#10223b;color:#fff;margin:0;font-family:Tahoma,Arial,sans-serif}main{max-width:1200px;margin:auto;padding:24px;text-align:center}h1{color:#e1bd6e;font-size:clamp(24px,4vw,48px)}.current{font-size:clamp(80px,18vw,220px);font-weight:bold;line-height:1.2;color:#e1bd6e}.waiting{display:flex;gap:16px;justify-content:center;flex-wrap:wrap}.waiting span{background:#213b5c;padding:14px 24px;border-radius:14px;font-size:clamp(24px,5vw,54px)}.controls{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}#status{font-size:clamp(20px,3vw,36px)}#connection{color:#e1bd6e}select,button{padding:12px;font:inherit}#clock{font-size:24px}</style></head><body><main><div class="controls"><label for="branch">الفرع</label><select id="branch"><option value="dmn">دمنهور</option><option value="alex">الإسكندرية</option></select><button id="fullscreen">ملء الشاشة</button></div><h1>عيادة د. يوسف عز الرجال</h1><p id="clock"></p><h2 id="status">جارٍ تحميل الدور…</h2><div id="current" class="current">—</div><h2>الأرقام التالية</h2><div id="next" class="waiting"></div><p id="connection" role="status" aria-live="polite"></p></main><script src="config.js" defer></script><script src="clinic-live.js" defer></script><script src="display.js" defer></script></body></html>
